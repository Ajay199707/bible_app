name: Build Android APK & iOS App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ----------------------------------------------------
  # 1. ANDROID APK BUILD (Ubuntu Runner)
  # ----------------------------------------------------
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: npm install

      - name: Build Web App
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle Executable
        run: chmod +x android/gradlew

      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: English-Tamil-Bible-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

  # ----------------------------------------------------
  # 2. iOS APP BUILD (macOS Cloud Runner)
  # ----------------------------------------------------
  build-ios:
    name: Build iOS App
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install Dependencies
        run: npm install

      - name: Build Web App
        run: npm run build

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Build iOS Xcode Project
        run: |
          cd ios/App
          xcodebuild -scheme App -derivedDataPath Build/ -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build

      - name: Zip iOS App Bundle
        run: |
          cd ios/App/Build/Products/Debug-iphonesimulator
          zip -r English-Tamil-Bible-iOS-App.zip App.app

      - name: Upload iOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: English-Tamil-Bible-iOS-App
          path: ios/App/Build/Products/Debug-iphonesimulator/English-Tamil-Bible-iOS-App.zip
